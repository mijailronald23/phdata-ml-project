version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/model:/app/model:ro
      - ./src/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - ./test-results:/app/test-results
      - ./test:/app/test:ro
      - ./src:/app/src:ro
    command: pytest test/integration -v
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
